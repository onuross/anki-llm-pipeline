<div class="front-hint">{{Meaning}}</div>

<div class="sentence-de">{{cloze:Sentence_German}}</div>

<script>
  // Magic script: Automatically hides the hint inside the cloze and replaces it with [...]
  setTimeout(function() {
      var clozeElements = document.querySelectorAll('.cloze');
      clozeElements.forEach(function(el) {
          el.innerHTML = '[...]';
      });
  }, 0);
</script>
